# Apply Supabase migrations that have not been applied yet.
#
# This used to re-run every file in supabase/migrations on each invocation,
# which only holds while every migration stays idempotent against every future
# shape of the schema. It does not: 0003 indexes `tasks.project`, 0007 drops
# that column, so replaying 0003 fails with `column "project" does not exist`.
# scripts/db-migrate.ts keeps a ledger and applies each file exactly once.
name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/db-migrate.ts"
      - ".github/workflows/db-apply.yml"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        run: npx tsx scripts/db-migrate.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_GITHUB_ACTIONS || secrets.SUPABASE_ACCESS_TOKEN }}
