# Publish JS-only EAS Updates after main pushes when the native fingerprint is
# unchanged from the last successful TestFlight iOS build (local eas build).
# Native changes defer to testflight-ios.yml.
#
# Required secret: EXPO_TOKEN — https://expo.dev/accounts/saussilberg/settings/access-tokens
# When missing, the job exits successfully with instructions in the log.
name: EAS Update (OTA)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "lib/**"
      - "!lib/**/__tests__/**"
      - "!mobile/**/__tests__/**"
  workflow_dispatch:
  workflow_run:
    workflows: ["TestFlight iOS"]
    types: [completed]
    branches: [main]

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  publish:
    name: Publish OTA update
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Publish EAS Update when fingerprint matches TestFlight build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/ci/eas-update.ts
