name: Trading tick

# Scanner + position manager for the trading system (Vercel Hobby crons are daily-only).
# Requires secrets: MYSELF_API_URL, TRADING_CRON_SECRET (same value as the Vercel env var).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: trading-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run tick
        env:
          MYSELF_API_URL: ${{ secrets.MYSELF_API_URL }}
          TRADING_CRON_SECRET: ${{ secrets.TRADING_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MYSELF_API_URL:-}" ] || [ -z "${TRADING_CRON_SECRET:-}" ]; then
            echo "Trading secrets not configured — skipping."
            exit 0
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 310 \
            -X POST -H "Authorization: Bearer ${TRADING_CRON_SECRET}" \
            "${MYSELF_API_URL%/}/api/trading/tick")
          cat response.json
          test "$code" = "200"
