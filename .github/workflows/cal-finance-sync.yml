name: Visa Cal finance sync

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The scraper needs CAL_USERNAME / CAL_PASSWORD. Without them every run
      # used to download a 700MB browser and then fail on missing_env — every
      # 20 minutes, since the workflow was added. Skip cleanly instead.
      - name: Check credentials
        id: creds
        env:
          CAL_USERNAME: ${{ secrets.CAL_USERNAME }}
          CAL_PASSWORD: ${{ secrets.CAL_PASSWORD }}
        run: |
          if [ -n "$CAL_USERNAME" ] && [ -n "$CAL_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CAL_USERNAME / CAL_PASSWORD secrets are not set — skipping sync."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      - name: Install Camoufox browser
        if: steps.creds.outputs.ok == 'true'
        run: npx camoufox-js fetch

      - name: Sync Visa Cal → MySelf
        if: steps.creds.outputs.ok == 'true'
        env:
          CAL_USERNAME: ${{ secrets.CAL_USERNAME }}
          CAL_PASSWORD: ${{ secrets.CAL_PASSWORD }}
          MYSELF_API_URL: ${{ secrets.MYSELF_API_URL }}
          FINANCE_INGEST_TOKEN: ${{ secrets.FINANCE_INGEST_TOKEN }}
        run: npm run sync:cal
