name: Leumi finance sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Camoufox browser
        run: npx camoufox-js fetch

      - name: Sync Leumi → MySelf
        env:
          LEUMI_USERNAME: ${{ secrets.LEUMI_USERNAME }}
          LEUMI_PASSWORD: ${{ secrets.LEUMI_PASSWORD }}
          MYSELF_API_URL: ${{ secrets.MYSELF_API_URL }}
          FINANCE_INGEST_TOKEN: ${{ secrets.FINANCE_INGEST_TOKEN }}
        run: npm run sync:leumi
