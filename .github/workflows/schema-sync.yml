name: Production schema sync

# Applies idempotent DDL on Vercel via DATABASE_URL (GitHub db-apply skips without secrets).
on:
  push:
    branches: [main]
    paths:
      - "lib/db-admin.ts"
      - "app/api/admin/schema-sync/**"
      - "supabase/migrations/0035_agent_whatsapp_dedup.sql"
      - ".github/workflows/schema-sync.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_GITHUB_ACTIONS || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            bash scripts/apply-supabase-sql.sh supabase/migrations/0035_agent_whatsapp_dedup.sql
            exit 0
          fi
          echo "SUPABASE_ACCESS_TOKEN not set — trying production schema-sync fallback."

      - name: Wait for Vercel deploy
        run: sleep 90

      - name: Apply schema on production (DATABASE_URL on Vercel)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_GITHUB_ACTIONS || secrets.SUPABASE_ACCESS_TOKEN }}
          MYSELF_API_URL: ${{ secrets.MYSELF_API_URL }}
          TRADING_CRON_SECRET: ${{ secrets.TRADING_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Already applied via Management API."
            exit 0
          fi
          if [ -z "${MYSELF_API_URL:-}" ] || [ -z "${TRADING_CRON_SECRET:-}" ]; then
            echo "ERROR: set SUPABASE_ACCESS_TOKEN or MYSELF_API_URL+TRADING_CRON_SECRET."
            exit 1
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer ${TRADING_CRON_SECRET}" \
            "${MYSELF_API_URL%/}/api/admin/schema-sync")
          cat response.json
          body=$(cat response.json)
          if echo "$body" | grep -q '"reason":"applied"'; then exit 0; fi
          if echo "$body" | grep -q '"reason":"no_postgres_url"'; then
            echo "WARN: DATABASE_URL missing on Vercel — dedup still works via select-before-insert."
            exit 0
          fi
          echo "$body" | grep -q '"ok":true'
          test "$code" = "200"
