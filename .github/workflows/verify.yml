# Typecheck + tests on every push to main and every PR.
#
# Previously `npm run verify` ran only on cursor/** PRs (chat-code-automerge),
# so direct pushes to main — the normal workflow here, and one that deploys —
# shipped without a single check. Two typecheck failures had accumulated on main
# unnoticed as a result.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled/unlabeled re-run the migration check when `migration-edit-ok` changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # mobile/tsconfig.json extends expo/tsconfig.base, which lives in
      # mobile/node_modules and is what supplies skipLibCheck and
      # esModuleInterop. Without this install the extends silently fails to
      # resolve, tsc falls back to defaults, and the mobile typecheck dies
      # type-checking .d.ts files inside node_modules.
      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Check for merge conflict markers
        run: npx tsx scripts/ci/check-conflict-markers.ts

      - name: Run verify
        run: npm run verify

  production-build:
    name: Production build (Expo web + next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Run production build
        run: npm run build

  migrations:
    uses: ./.github/workflows/migrations-check.yml
