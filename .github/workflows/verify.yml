# Typecheck + tests on every push to main and every PR.
#
# Previously `npm run verify` ran only on cursor/** PRs (chat-code-automerge),
# so direct pushes to main — the normal workflow here, and one that deploys —
# shipped without a single check. Two typecheck failures had accumulated on main
# unnoticed as a result.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verify
        run: npm run verify
