# Auto-merge Cursor chat-code PRs to main after verify passes.
# Qualifies: head branch cursor/** OR label chat-code.
# Does not wait on TestFlight / EAS iOS (known free-plan exhaustion).
name: Chat code automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

concurrency:
  group: chat-code-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  qualify:
    name: Qualify PR
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check branch or label
        id: check
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          if [[ "$HEAD_REF" == cursor/* ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$LABELS" | grep -q '"name": "chat-code"'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=false" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify (typecheck + tests)
    needs: qualify
    if: needs.qualify.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verify
        run: npm run verify

  merge:
    name: Squash merge to main
    needs: [qualify, verify]
    if: needs.qualify.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT || github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --squash \
            --delete-branch \
            --repo "${{ github.repository }}"
